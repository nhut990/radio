  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #b7d8ff 0%, #e0c3fc 100%);
      min-height: 100vh;
      margin: 0; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .player-container {
      background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 32px rgba(100,100,180,0.13);
      border-radius: 18px;
      padding: 28px 22px;
      max-width: 420px; width: 100%;
      margin: 36px;
    }
    .logo-wrap { display:block; margin:0 auto 14px; width:160px; height:auto; }
    h2 { text-align:center; margin:0 0 12px; color:#3652aa; font-size:20px; }
    .station-name { text-align:center; font-weight:600; color:#2a3b78; margin-bottom:10px; font-size:16px; }
    label { font-size:16px; display:block; margin-bottom:4px; color:#333; }
    select { width:100%; padding:8px 6px; border-radius:6px; border:1px solid #dbe9ff; background:#f7fbff; font-size:16px; margin-bottom:14px; }
    #playBtn {
      background: linear-gradient(90deg, #59c4fc 0%, #b18aff 100%);
      color:#fff; border:none; border-radius:8px; font-weight:700;
      padding:11px 0; width:100%; cursor:pointer; font-size:17px;
    }
    audio { margin-top:16px; width:100%; border-radius:6px; }
    #status { margin-top:8px; font-size:13px; color:#556; min-height:1.4em; }
  </style>
</head>
<body>
<div class="player-container" role="region" aria-label="Radio VOH player">

  <!-- Logo VOH chính thức: wordmark đỏ #CC0000, theo Wikipedia SVG -->
  <svg class="logo-wrap" viewBox="0 0 512 324" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="Logo VOH">
    <rect width="512" height="324" fill="white" rx="14"/>
    <text x="256" y="270"
          text-anchor="middle"
          font-family="Arial Black, Impact, 'Franklin Gothic Heavy', sans-serif"
          font-weight="900"
          font-size="252"
          fill="#CC0000">VOH</text>
  </svg>

  <h2>Nghe Radio VOH</h2>
  <div class="station-name" id="stationName">VOH FM 99.9</div>

  <label for="radioSelect">Chọn kênh radio:</label>
  <select id="radioSelect" aria-label="Chọn kênh radio">
    <option value="https://strm.voh.com.vn/radio/channel3/playlist.m3u8">VOH FM 99.9</option>
    <option value="https://strm.voh.com.vn/radio/channel1/playlist.m3u8">VOH FM 95.6</option>
    <option value="https://strm.voh.com.vn/radio/channel5/playlist.m3u8">VOH FM 87.7</option>
    <option value="https://strm.voh.com.vn/radio/channel2/playlist.m3u8">VOH AM 610</option>
  </select>

  <button id="playBtn" aria-pressed="false">▶ Bắt đầu phát</button>
  <audio id="audio" controls preload="none"></audio>
  <div id="status" role="status" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
<script>
(function(){
  const audio=document.getElementById('audio'),
        sel=document.getElementById('radioSelect'),
        btn=document.getElementById('playBtn'),
        st=document.getElementById('status'),
        sn=document.getElementById('stationName');
  let hls=null, playing=false;
  const ios=/iP(hone|od|ad)/.test(navigator.userAgent)&&!window.MSStream;
  sn.textContent=sel.options[sel.selectedIndex].text;
  let stTimer=null;
  function setS(m,auto){
    st.textContent=m;
    clearTimeout(stTimer);
    if(auto)stTimer=setTimeout(()=>{st.textContent='';},3000);
  }
  function destroyHls(){if(hls){try{hls.destroy();}catch(e){}hls=null;}}
  function native(){return ios||audio.canPlayType('application/vnd.apple.mpegurl')!=='';}
  function setup(url){
    destroyHls();
    if(native()){audio.src=url;audio.crossOrigin='anonymous';st.textContent='';return;}
    if(window.Hls&&Hls.isSupported()){
      hls=new Hls({enableWorker:true});
      hls.attachMedia(audio);
      hls.on(Hls.Events.MEDIA_ATTACHED,()=>{setS('Đang tải…',true);hls.loadSource(url);});
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{setS('Sẵn sàng.',true);});
      hls.on(Hls.Events.ERROR,(e,d)=>{
        if(d&&d.fatal){
          if(d.type===Hls.ErrorTypes.NETWORK_ERROR)hls.startLoad();
          else if(d.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();
          else destroyHls();
          setS('Lỗi: '+d.type,true);
        }
      });
    }else{audio.src=url;}
  }
  setup(sel.value);
  sel.addEventListener('change',()=>{
    sn.textContent=sel.options[sel.selectedIndex].text;
    setup(sel.value);
    if(playing)audio.play().catch(()=>{});
  });
  btn.addEventListener('click',()=>{
    if(!playing){setup(sel.value);audio.play().catch(()=>setS('Bấm lại để phát.'));}
    else{try{audio.pause();}catch(e){}}
  });
  audio.addEventListener('play',()=>{playing=true;btn.textContent='⏸ Tạm dừng';btn.setAttribute('aria-pressed','true');st.textContent='';});
  audio.addEventListener('pause',()=>{playing=false;btn.textContent='▶ Phát';btn.setAttribute('aria-pressed','false');st.textContent='';});
  audio.addEventListener('waiting',()=>setS('Đang đệm...',true));
  audio.addEventListener('error',()=>setS('Lỗi phát luồng. Kiểm tra kết nối.',false));
  window.addEventListener('beforeunload',destroyHls);
})();
</script>
</body>
</html>
